<div class="chat-container rounded-xl p-3">
    <div class="flex justify-end mb-2">
        <div class="chat-message-bubble chat-bubble-right">
            <p class="chat-message-text whitespace-pre-wrap break-words">{{ entry.user_msg or '-' }}</p>
            <div class="chat-message-meta justify-end">
                <span class="chat-message-author">{{ detail.first_name or detail.user_id }}</span>
                <span class="chat-message-time">
                    {{ entry.timestamp[11:16] if entry.timestamp and entry.timestamp|length > 16 else '' }}
                </span>
            </div>
        </div>
    </div>
    <div class="flex justify-start">
        <div class="chat-message-bubble chat-bubble-left">
            <p class="chat-message-text whitespace-pre-wrap break-words">{{ entry.ai_msg or '-' }}</p>
            <div class="chat-message-meta">
                <span class="chat-message-author text-indigo-600">Bot</span>
                <span class="chat-message-time">
                    {{ entry.timestamp[11:16] if entry.timestamp and entry.timestamp|length > 16 else '' }}
                </span>
            </div>
        </div>
    </div>
</div>
