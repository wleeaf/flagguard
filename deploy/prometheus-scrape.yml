scrape_configs:
  - job_name: "aishield_bot"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "127.0.0.1:8443"

  - job_name: "aishield_panel"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - "127.0.0.1:8000"
